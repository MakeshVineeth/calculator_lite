name: calculator_lite
description: 'Calculator Lite: Fast calculations, currency converter, history tracking, and professional productivity.'

publish_to: 'none'
version: 2.1.4+25

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^2.0.0
  animations: ^3.0.0
  auto_size_text: ^3.0.0
  auto_size_text_field: ^2.2.4
  country_icons: ^3.0.0
  animated_search_bar: ^2.8.0
  flutter_slidable: ^5.2.0
  octo_image: ^2.1.0

  # Mathematical & Calculation Engine
  decimal: ^3.2.1
  angles: ^2.1.1
  charcode: ^1.4.0
  math_expressions: ^3.2.0

  # Data Persistence & State Management
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # Network & Hardware / System Integration
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.1
  quick_actions: ^1.1.0
  flutter_displaymode: ^0.7.0
  share_plus: ^13.3.1
  flutter_windowmanager_plus: ^1.1.1

  # Monetization & Reviews
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5

  # Data Export
  excel: ^4.0.6
  archive: ^3.6.1
  intl: ^0.20.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  hive_ce_generator: ^1.12.1
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
