<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" fill="#cdd6f4" font-size="24" font-weight="700">[Component] Calculator Lite Feature Architecture</text>
  <text x="575" y="65" text-anchor="middle" fill="#a6adc8" font-size="14">C4 Model - Level 3: Component Diagram</text>

  <!-- Container Box -->
  <rect x="50" y="90" width="1050" height="650" rx="20" fill="#181825" stroke="#45475a" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="80" y="125" fill="#a6adc8" font-size="16" font-weight="600">Application Feature Modules (lib/src/features/ &amp; core/)</text>

  <!-- Calculator Feature Component -->
  <g transform="translate(100, 160)" filter="url(#shadow)">
    <rect width="270" height="150" rx="14" fill="#00796B" stroke="#4DB6AC" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Calculator Feature</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: Tokenizer &amp; Evaluator]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• ExpressionParser &amp; Sanitizer</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• MathEvaluator (Trig, Log, Rad/Deg)</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• CalculatorScreen &amp; CustomKeypad</text>
  </g>

  <!-- Currency Feature Component -->
  <g transform="translate(440, 160)" filter="url(#shadow)">
    <rect width="270" height="150" rx="14" fill="#00796B" stroke="#4DB6AC" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Currency Feature</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: Conversion &amp; Sync]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• CurrencyApiClient (Dio / HTTPS)</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• CurrencyRepository (Hive cache)</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• CurrencyTab &amp; CountryPicker</text>
  </g>

  <!-- History Feature Component -->
  <g transform="translate(780, 160)" filter="url(#shadow)">
    <rect width="270" height="150" rx="14" fill="#00796B" stroke="#4DB6AC" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">History Feature</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: Local Record Management]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• HistoryItem Entity &amp; Adapter</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• HistoryRepository (CRUD)</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• HistoryTab, Filter &amp; Inline Edit</text>
  </g>

  <!-- Export Feature Component -->
  <g transform="translate(100, 420)" filter="url(#shadow)">
    <rect width="270" height="140" rx="14" fill="#00695C" stroke="#26A69A" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Export Feature</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: Report Generator]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• Excel &amp; CSV Exporters</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• Date Range Filtering</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• Native Share Sheet Integration</text>
  </g>

  <!-- Pro / Billing Feature Component -->
  <g transform="translate(440, 420)" filter="url(#shadow)">
    <rect width="270" height="140" rx="14" fill="#00695C" stroke="#26A69A" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Pro Upgrade Feature</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: In-App Billing]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• InAppPurchase Service</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• PurchaseStatusProvider</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• ProScreen &amp; License Check</text>
  </g>

  <!-- Security & System Core -->
  <g transform="translate(780, 420)" filter="url(#shadow)">
    <rect width="270" height="140" rx="14" fill="#004D40" stroke="#00BFA5" stroke-width="2"/>
    <text x="135" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Security &amp; System Core</text>
    <text x="135" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Component: Cross-Cutting Core]</text>
    <text x="135" y="80" text-anchor="middle" fill="#e0f2f1" font-size="11">• OWASP Sanitization &amp; Limits</text>
    <text x="135" y="100" text-anchor="middle" fill="#e0f2f1" font-size="11">• SecureWindowManager (FLAG_SECURE)</text>
    <text x="135" y="120" text-anchor="middle" fill="#e0f2f1" font-size="11">• Material 3 Dynamic Theme Provider</text>
  </g>

  <!-- Component Inter-relationships -->
  <path d="M 370 235 L 780 235" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="225" text-anchor="middle" fill="#cdd6f4" font-size="11">Saves evaluated calculations</text>

  <path d="M 915 310 L 915 420" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="965" y="365" text-anchor="middle" fill="#cdd6f4" font-size="11">Data source</text>

  <path d="M 780 490 L 370 490" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="480" text-anchor="middle" fill="#cdd6f4" font-size="11">Validates data formats &amp; permissions</text>
</svg>
