<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="550" y="40" text-anchor="middle" fill="#cdd6f4" font-size="24" font-weight="700">[Container] Calculator Lite Architecture</text>
  <text x="550" y="65" text-anchor="middle" fill="#a6adc8" font-size="14">C4 Model - Level 2: Container Diagram</text>

  <!-- User on Left -->
  <g transform="translate(40, 280)" filter="url(#shadow)">
    <rect width="160" height="130" rx="14" fill="#004D40" stroke="#26A69A" stroke-width="2"/>
    <circle cx="80" cy="35" r="16" fill="#80CBC4"/>
    <text x="80" y="80" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">App User</text>
    <text x="80" y="98" text-anchor="middle" fill="#b2dfdb" font-size="10">[Person]</text>
    <text x="80" y="115" text-anchor="middle" fill="#e0f2f1" font-size="9">Mobile device user</text>
  </g>

  <!-- System Boundary Box -->
  <rect x="240" y="100" width="580" height="600" rx="20" fill="#181825" stroke="#45475a" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="260" y="130" fill="#a6adc8" font-size="14" font-weight="600">Calculator Lite Application [Flutter / Dart]</text>

  <!-- UI Container -->
  <g transform="translate(280, 160)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" fill="#00796B" stroke="#4DB6AC" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Presentation Layer</text>
    <text x="115" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container: Flutter Material 3]</text>
    <text x="115" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">Keypad, display, currency cards,</text>
    <text x="115" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">history list, &amp; navigation</text>
  </g>

  <!-- State Management Container -->
  <g transform="translate(560, 160)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" fill="#00695C" stroke="#4DB6AC" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">State Management</text>
    <text x="115" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container: Provider / Notifiers]</text>
    <text x="115" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">Decoupled reactive business state</text>
    <text x="115" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">&amp; UI state dispatchers</text>
  </g>

  <!-- Domain Calculation Engine -->
  <g transform="translate(420, 330)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" fill="#00897B" stroke="#80CBC4" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Domain &amp; Engine</text>
    <text x="115" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container: Pure Dart]</text>
    <text x="115" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">Expression tokenizer, sanitizer,</text>
    <text x="115" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">&amp; scientific math evaluators</text>
  </g>

  <!-- Data & Local Persistence -->
  <g transform="translate(280, 500)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" fill="#004D40" stroke="#26A69A" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Persistence Container</text>
    <text x="115" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container: Hive CE / Prefs]</text>
    <text x="115" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">NoSQL local history storage,</text>
    <text x="115" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">offline rates, and preferences</text>
  </g>

  <!-- Network Container -->
  <g transform="translate(560, 500)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" fill="#004D40" stroke="#26A69A" stroke-width="2"/>
    <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Network Client</text>
    <text x="115" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container: Dio HTTPS Client]</text>
    <text x="115" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">Secure REST exchange client</text>
    <text x="115" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">with timeouts and offline fallback</text>
  </g>

  <!-- External Systems on Right -->
  <g transform="translate(880, 500)" filter="url(#shadow)">
    <rect width="180" height="110" rx="12" fill="#37474F" stroke="#78909C" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Exchange API</text>
    <text x="90" y="55" text-anchor="middle" fill="#b0bec5" font-size="10">[External System]</text>
    <text x="90" y="80" text-anchor="middle" fill="#cfd8dc" font-size="9">Global rate providers</text>
  </g>

  <!-- Connectors -->
  <path d="M 200 345 L 280 230" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 215 L 560 215" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 270 L 560 330" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 490 440 L 410 500" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 440 L 640 500" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 555 L 880 555" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
