<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" fill="#cdd6f4" font-size="24" font-weight="700">[Deployment] Mobile Device &amp; Cloud Infrastructure</text>
  <text x="575" y="65" text-anchor="middle" fill="#a6adc8" font-size="14">C4 Model - Level 4: Deployment Diagram</text>

  <!-- Node 1: User Mobile Device -->
  <rect x="50" y="100" width="680" height="630" rx="16" fill="#181825" stroke="#26A69A" stroke-width="2"/>
  <text x="80" y="130" fill="#80CBC4" font-size="16" font-weight="700">📱 User Mobile Device [Android / iOS Device]</text>

  <!-- Sub-Node: App Security Sandbox -->
  <rect x="80" y="150" width="620" height="350" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="100" y="180" fill="#a6adc8" font-size="14" font-weight="600">Application Security Sandbox (Isolated UID / Private App Storage)</text>

  <!-- Container: Compiled App -->
  <g transform="translate(110, 200)" filter="url(#shadow)">
    <rect width="260" height="110" rx="10" fill="#00796B" stroke="#4DB6AC" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Calculator Lite App</text>
    <text x="130" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container Instance: AOT Flutter]</text>
    <text x="130" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">High-performance arm64 binary</text>
    <text x="130" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">with Ahead-Of-Time compilation</text>
  </g>

  <!-- Container: Local Hive Storage -->
  <g transform="translate(410, 200)" filter="url(#shadow)">
    <rect width="260" height="110" rx="10" fill="#004D40" stroke="#26A69A" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Sandboxed Storage</text>
    <text x="130" y="52" text-anchor="middle" fill="#b2dfdb" font-size="11">[Container Instance: Hive NoSQL]</text>
    <text x="130" y="75" text-anchor="middle" fill="#e0f2f1" font-size="10">Local binary database for history</text>
    <text x="130" y="92" text-anchor="middle" fill="#e0f2f1" font-size="10">&amp; cached exchange rates</text>
  </g>

  <!-- Container: SharedPreferences -->
  <g transform="translate(260, 350)" filter="url(#shadow)">
    <rect width="260" height="90" rx="10" fill="#004D40" stroke="#26A69A" stroke-width="2"/>
    <text x="130" y="30" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">SharedPreferences Cache</text>
    <text x="130" y="48" text-anchor="middle" fill="#b2dfdb" font-size="10">[Container Instance: Key-Value]</text>
    <text x="130" y="70" text-anchor="middle" fill="#e0f2f1" font-size="10">User theme and UI state flags</text>
  </g>

  <!-- Sub-Node: OS Platform Layer -->
  <rect x="80" y="520" width="620" height="180" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <text x="100" y="545" fill="#a6adc8" font-size="14" font-weight="600">OS Security &amp; Services Layer (Android / iOS SDK)</text>

  <g transform="translate(110, 565)" filter="url(#shadow)">
    <rect width="260" height="85" rx="8" fill="#37474F" stroke="#78909C" stroke-width="1.5"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Window Manager</text>
    <text x="130" y="46" text-anchor="middle" fill="#cfd8dc" font-size="10">FLAG_SECURE Privacy</text>
    <text x="130" y="66" text-anchor="middle" fill="#cfd8dc" font-size="9">Blocks screenshots &amp; preview</text>
  </g>

  <g transform="translate(410, 565)" filter="url(#shadow)">
    <rect width="260" height="85" rx="8" fill="#37474F" stroke="#78909C" stroke-width="1.5"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">OS Network Stack</text>
    <text x="130" y="46" text-anchor="middle" fill="#cfd8dc" font-size="10">TLS 1.3 / Cleartext Disabled</text>
    <text x="130" y="66" text-anchor="middle" fill="#cfd8dc" font-size="9">Enforces encrypted HTTPS</text>
  </g>

  <!-- Node 2: External Cloud Services -->
  <rect x="780" y="100" width="320" height="630" rx="16" fill="#181825" stroke="#78909C" stroke-width="2"/>
  <text x="800" y="130" fill="#cfd8dc" font-size="16" font-weight="700">☁️ External Cloud Services</text>

  <g transform="translate(810, 200)" filter="url(#shadow)">
    <rect width="260" height="130" rx="12" fill="#263238" stroke="#546E7A" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Exchange Rate API</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="11">[Cloud Infrastructure]</text>
    <text x="130" y="85" text-anchor="middle" fill="#eceff1" font-size="10">Provides real-time currency</text>
    <text x="130" y="105" text-anchor="middle" fill="#eceff1" font-size="10">exchange rate data</text>
  </g>

  <g transform="translate(810, 420)" filter="url(#shadow)">
    <rect width="260" height="130" rx="12" fill="#263238" stroke="#546E7A" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Google Play Services</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="11">[Cloud Infrastructure]</text>
    <text x="130" y="85" text-anchor="middle" fill="#eceff1" font-size="10">Play Store in-app purchases</text>
    <text x="130" y="105" text-anchor="middle" fill="#eceff1" font-size="10">&amp; license verification</text>
  </g>

  <!-- Network Connectors -->
  <path d="M 670 605 L 940 605 L 940 330" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="595" text-anchor="middle" fill="#89dceb" font-size="11">HTTPS / TLS 1.3</text>

  <path d="M 370 255 L 410 255" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 310 L 310 350" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 310 L 240 565" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
